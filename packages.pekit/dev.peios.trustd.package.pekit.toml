# Machine trust authority, least-privilege service policy, registry schema, and
# the SYSTEM pre-start hook that delegates only its rendered-store directory.
side_effects = ["man-db"]

[package]
name        = "dev.peios.trustd"
description = "Peios machine trust-store composition and query service"



[dependencies]
"dev.peios.libpeios"   = ">= 0.5.0"
"org.gnu.glibc"        = "*"
"org.gnu.gcc-libgcc"   = "*"
"dev.peios.peiosutils" = "*"
ca-certificates         = "*"
sh                      = "*"

[files]
"@source:LICENSE"                         = "usr/share/licenses/dev.peios.trustd/LICENSE"
":licenses/**"                            = "usr/share/licenses/dev.peios.trustd/third-party"
":usr/sbin/trustd"                        = "usr/sbin/trustd"
":usr/libexec/trustd/prepare-store"       = "usr/libexec/trustd/prepare-store"
":usr/share/regim/trustd-service.reg"     = "usr/share/regim/trustd-service.reg"
":usr/share/regman/trustd.regman"         = "usr/share/regman/trustd.regman"
":usr/share/man/man8/trustd.8.gz"         = "usr/share/man/man8/trustd.8.gz"
