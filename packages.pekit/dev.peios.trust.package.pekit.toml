# Stateless operator client. It speaks the public trust socket protocol and
# writes policy through the registry, so another conforming trust authority can
# satisfy it without pulling this daemon package into the transaction.
side_effects = ["man-db"]

[package]
name        = "dev.peios.trust"
description = "Operator command for the Peios machine trust store"

[provides]
trust = "{{version}}-1"

[replaces]
trust = "<= 0.1.0-10"

[dependencies]
"dev.peios.libpeios" = ">= 0.5.0"
"org.gnu.glibc"      = "*"
"org.gnu.gcc-libgcc" = "*"

[files]
"@source:LICENSE"                    = "usr/share/licenses/dev.peios.trust/LICENSE"
":licenses/**"                       = "usr/share/licenses/dev.peios.trust/third-party"
":usr/bin/trust"                     = "usr/bin/trust"
":usr/share/man/man1/trust.1.gz"     = "usr/share/man/man1/trust.1.gz"
