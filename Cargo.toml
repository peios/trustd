[workspace]
resolver = "2"
members = ["libtrust", "trustd", "trust"]

# trustd is its own workspace root, like netd and resolvd.
#
#   libtrust  the control wire: paths, rights, request/reply codec, the root
#             record. No I/O, no policy.
#   trustd    the daemon. Composes the shipped bundle with the registry's
#             additions and distrusts, renders the compat files, serves the
#             effective set on its socket.
#   trust     the operator command. Reads over the socket, writes to the
#             registry — the same path `reg` takes, so the key's descriptor
#             is the only gate.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2"
peios = { path = "../peios-rs/peios" }
