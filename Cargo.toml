[workspace]
resolver = "2"
members = ["libtrust", "trust-client", "trust-abi", "trust-core", "trust-client-core", "trustd", "trust"]

# trustd is its own workspace root, like netd and resolvd.
#
#   trust-core  the control wire: paths, rights, request/reply codec, the root
#             record. No I/O, no policy.
#   trustd    the daemon. Composes the shipped bundle with the registry's
#             additions and distrusts, renders the compat files, serves the
#             effective set on its socket.
#   trust     the operator command. Reads over the socket, writes to the
#             registry — the same path `reg` takes, so the key's descriptor
#             is the only gate.

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2"
# Exact public binding revision shared with the qualified Eventd release.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "4c9c0106550e3b7d8b4a98dfd0d7a5490fcf0116", package = "peios" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
