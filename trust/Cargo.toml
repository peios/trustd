[package]
name = "trust"
description = "Operator command for the Peios trust store, and the library that changes it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What changes the store, shared with Security Policy's Certificates.

[[bin]]
name = "trust"
path = "src/main.rs"

[dependencies]
trust-core = { path = "../trust-core" }
# The same certificate handling the daemon uses, so `trust add` rejects what
# trustd would reject, at the moment a person can still fix it.
libc = { workspace = true }
peios = { workspace = true }

trust-client = { path = "../trust-client" }
