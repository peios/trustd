[package]
name = "trustd"
description = "The Peios trust store: composes the shipped roots with the registry's additions and distrusts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "trustd"
path = "src/lib.rs"

[[bin]]
name = "trustd"
path = "src/main.rs"

[dependencies]
libtrust = { path = "../libtrust" }
libc = { workspace = true }
peios = { workspace = true }
# X.509 is a format read from untrusted-adjacent input (the shipped bundle
# and whatever an administrator wrote into the registry), so it gets a real
# parser rather than a hand-rolled DER walk.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
der = "0.7"
sha2 = "0.10"
# The OpenSSL hashed-directory name is SHA-1 of the canonical subject; the
# algorithm is OpenSSL's, not a security choice of ours.
sha1 = "0.10"
