[package]
name        = "dev.peios.trustd-debuginfo"
description = "Debugging symbols for the Peios machine trust service"
# The same crate closure as trustd; checked by build.main.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[dependencies]
"dev.peios.trustd" = "= {{release}}"

[files]
"@source:LICENSE"                  = "usr/share/licenses/dev.peios.trustd-debuginfo/LICENSE"
":licenses/trustd/**"              ="usr/share/licenses/dev.peios.trustd-debuginfo/third-party"
":debug/trustd/usr/lib/debug/**"   = "usr/lib/debug"
